---
name: llvm
description: |
  Install LLVM/Clang 16 and GoogleTest from apt, and select them under
  the unversioned tool names, so that cmake and the scripts do not pick
  up the newer clang the runner image ships with.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang-16 \
          clang-tidy-16 \
          libclang-16-dev \
          libcurl4-openssl-dev \
          libedit-dev \
          libgmock-dev \
          libgtest-dev \
          libxml2-dev \
          libzstd-dev \
          llvm-16 \
          llvm-16-dev \
          python3-requests \
          python3-yaml \
          time \
          zlib1g-dev
        for tool in clang clang++ clang-tidy llvm-cov llvm-profdata; do
          sudo update-alternatives --install \
            "/usr/bin/${tool}" "${tool}" "/usr/bin/${tool}-16" 100
          sudo update-alternatives --set "${tool}" "/usr/bin/${tool}-16"
        done
        clang --version
        clang-tidy --version
